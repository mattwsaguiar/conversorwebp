name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pillow pyinstaller

      - name: Gerar EXE
        run: pyinstaller --onefile --windowed --name WebPConverter webp_converter.py

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: WebPConverter-Windows
          path: dist/WebPConverter.exe
          retention-days: 30
